<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Controle de insumos</title>
<style>
:root{--bg:#f2f1ec;--card:#fff;--ink:#1f2a1f;--mut:#6b756b;--line:#dcdad0;--in:#2e7d4f;--out:#b8501f;--acc:#25402b;--on:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141a15;--card:#1d251e;--ink:#e8ece6;--mut:#9aa69a;--line:#2f3a30;--in:#5cbf86;--out:#e8885a;--acc:#5cbf86;--on:#0f1a12}}
:root[data-theme="dark"]{--bg:#141a15;--card:#1d251e;--ink:#e8ece6;--mut:#9aa69a;--line:#2f3a30;--in:#5cbf86;--out:#e8885a;--acc:#5cbf86;--on:#0f1a12}}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:16px}
main{max-width:820px;margin:0 auto}
h1{font-size:22px;margin:4px 0 2px}
h2{font-size:16px;margin:0 0 10px}
.who{color:var(--mut);font-size:14px;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
.saldos{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.s{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px}
.s b{display:block;font-size:13px;color:var(--mut);font-weight:500}
.s span{font-size:24px;font-weight:700}
.s small{color:var(--mut);font-size:13px}
.s.neg span{color:var(--out)}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.tabs button{padding:12px;border:2px solid var(--line);background:transparent;color:var(--ink);border-radius:8px;font:600 16px inherit;font-family:inherit;cursor:pointer}
.tabs button.on.in{background:var(--in);border-color:var(--in);color:var(--on)}
.tabs button.on.out{background:var(--out);border-color:var(--out);color:var(--on)}
label{display:block;font-size:14px;color:var(--mut);margin:10px 0 4px}
input,select{width:100%;padding:11px;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.go{width:100%;margin-top:14px;padding:13px;border:0;border-radius:8px;background:var(--acc);color:var(--on);font:700 16px inherit;font-family:inherit;cursor:pointer}
.ghost{background:transparent;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:8px 12px;font:inherit;cursor:pointer}
.msg{margin-top:10px;font-size:14px;min-height:20px}
.msg.err{color:var(--out)}.msg.ok{color:var(--in)}
.h{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.h:first-of-type{border-top:0}
.h .q{font-weight:700;min-width:96px}
.h .q.in{color:var(--in)}.h .q.out{color:var(--out)}
.h .d{flex:1;font-size:14px}
.h .d i{display:block;color:var(--mut);font-style:normal}
.h button{background:none;border:0;color:var(--mut);font-size:20px;cursor:pointer;padding:4px 8px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px;margin-bottom:6px}
th,td{padding:7px 8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--mut);font-weight:500}
td.in{color:var(--in)}td.out{color:var(--out)}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:12px}
.filters label{margin:0 0 3px;font-size:13px}
.empty{color:var(--mut);padding:10px 0}
.hint{font-size:14px;font-weight:600;color:var(--in);margin-top:6px;min-height:20px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
</style>
</head>
<body>
<main>
<h1>Controle de insumos</h1>
<div class="who" id="who">Carregando insumos...</div>
<div class="adm" hidden><h2>Estoque disponível para retirada</h2>
<div class="saldos" id="saldos"></div></div>

<section class="card">
 <div class="tabs">
  <button id="tIn" class="on in" type="button">Entrada (recebi)</button>
  <button id="tOut" class="out" type="button">Retirada (usei)</button>
 </div>
 <label for="quem">Quem está lançando</label>
 <input id="quem" type="text" maxlength="40" autocomplete="name" placeholder="Digite seu nome e sobrenome">
 <label for="ins">Insumo</label>
 <select id="ins"></select>
 <div class="hint" id="disp"></div>
 <div class="row">
  <div><label for="qtd">Quantidade (toneladas)</label><input id="qtd" type="number" inputmode="decimal" min="0" step="any" placeholder="0"></div>
  <div><label for="dat">Data</label><input id="dat" type="date"></div>
 </div>
 <div id="plW"><label for="pla">Placa do caminhão</label><input id="pla" type="text" maxlength="8" autocapitalize="characters" placeholder="ABC1D23"></div>
 <div id="nfW"><div class="row"><div><label for="forn">Fornecedor</label><input id="forn" type="text" maxlength="60"></div><div><label for="nf">Nota fiscal</label><input id="nf" type="text" maxlength="20" inputmode="numeric"></div></div></div>
 <button class="go" id="salvar" type="button">Registrar entrada</button>
 <div class="msg" id="msg" role="status"></div>
</section>

<section class="card adm" hidden>
 <h2>Comparar entradas e retiradas</h2>
 <div class="filters">
  <div><label for="fIns">Insumo</label><select id="fIns"></select></div>
  <div><label for="fUser">Quem lançou</label><select id="fUser"></select></div>
  <div><label for="fDe">De</label><input id="fDe" type="date"></div>
  <div><label for="fAte">Até</label><input id="fAte" type="date"></div>
 </div>
 <div class="scroll"><table id="resumo"></table></div>
 <h2 style="margin-top:14px">Por mês</h2>
 <div class="scroll"><table id="mensal"></table></div>
</section>

<section class="card adm" hidden>
 <h2>Histórico</h2>
 <div style="margin-bottom:10px"><button class="ghost" id="csv" type="button">Copiar planilha</button> <span class="who" id="cont"></span></div>
 <div id="hist"></div>
</section>

<section class="card adm" hidden>
 <h2>Cadastrar novo insumo</h2>
 <div class="row">
  <div><label for="nn">Nome do Insumo</label><input id="nn" type="text" maxlength="30" placeholder="Ex.: Ureia"></div>
 </div>
 <button class="go" id="add" type="button" style="margin-top:10px">Adicionar insumo</button>
</section>
<div style="text-align:center;margin:8px 0 24px"><button class="ghost" id="gest" type="button">Área do gestor</button></div>
</main>

<script>
(function(){
var API = "https://script.google.com/macros/s/AKfycbygVMGMTKv6tF4kQgXgswLZD2lvVboxi_jeE-_fK28FguT7j7bKitCY4-hlYnKaRp4R/exec"; // Substitua pela URL gerada no Apps Script (terminada em /exec)

var $=function(i){return document.getElementById(i)};
var nf=new Intl.NumberFormat("pt-BR",{maximumFractionDigits:3});
var tipo="in", unlocked=false, codigoGestor="", dadosGestor=null, insumosLista=[];

function hoje(){var d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10)}
function br(d){if(!d)return"";var p=d.split("T")[0].split("-");return p.length===3?p[2]+"/"+p[1]+"/"+p[0]:d}
function esc(s){return String(s||"").replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function msg(t,c){var m=$("msg");m.textContent=t;m.className="msg "+c}

function setTipo(t){
  tipo=t;
  $("tIn").className=(t==="in"?"on ":"")+"in";
  $("tOut").className=(t==="out"?"on ":"")+"out";
  $("salvar").textContent=t==="in"?"Registrar entrada":"Registrar retirada";
  $("plW").hidden=t!=="in";
  $("nfW").hidden=t!=="in";
}

$("tIn").onclick=function(){setTipo("in")};
$("tOut").onclick=function(){setTipo("out")};

function carregarInsumosPublicos(){
  if(API.includes("COLE_AQUI")) {
    $("who").textContent="Configure a URL da API no arquivo index.html";
    return;
  }
  fetch(API + "?acao=carregarInsumos")
    .then(res => res.json())
    .then(data => {
      if(data.status === "sucesso"){
        insumosLista = data.insumos;
        var opts = insumosLista.map(i => '<option value="'+esc(i)+'">'+esc(i)+'</option>').join("");
        $("ins").innerHTML = opts;
        $("fIns").innerHTML = '<option value="">Todos os insumos</option>' + opts;
        $("who").textContent = "Pronto para novos lançamentos.";
      }
    })
    .catch(err => {
      $("who").textContent = "Erro ao carregar insumos.";
    });
}

function atualizarTelaGestor(){
  if(!unlocked || !dadosGestor) return;
  
  // Saldos
  var estoqueHTML = "";
  for(var insumo in dadosGestor.estoque){
    var qtd = dadosGestor.estoque[insumo];
    estoqueHTML += '<div class="s'+(qtd<0?" neg":"")+'"><b>'+esc(insumo)+'</b><span>'+nf.format(qtd)+'</span> <small>t disponíveis</small></div>';
  }
  $("saldos").innerHTML = estoqueHTML || '<div class="empty">Sem dados de estoque.</div>';

  // Histórico e Filtros
  var hist = dadosGestor.historico;
  var fInsVal = $("fIns").value;
  var fUserVal = $("fUser").value;
  
  // Usuários para filtro
  var users = [];
  hist.forEach(function(m){ if(m.quemLancou && users.indexOf(m.quemLancou)<0) users.push(m.quemLancou); });
  $("fUser").innerHTML = '<option value="">Todas as pessoas</option>' + users.map(u => '<option value="'+esc(u)+'">'+esc(u)+'</option>').join("");

  var filtrados = hist.filter(function(m){
    return (!fInsVal || m.insumo === fInsVal) && (!fUserVal || m.quemLancou === fUserVal);
  });

  $("cont").textContent = filtrados.length + " lançamento(s)";
  $("hist").innerHTML = filtrados.length ? filtrados.map(function(m){
    var cor = m.tipo === "Entrada" ? "in" : "out";
    var sinal = m.tipo === "Entrada" ? "+ " : "− ";
    return '<div class="h"><div class="q '+cor+'">'+sinal+nf.format(m.quantidade)+' t</div><div class="d"><b>'+esc(m.insumo)+'</b> · '+esc(m.tipo)+' em '+br(m.dataHora)+'<i>'+(m.fornecedor&&m.fornecedor!=="-"?esc(m.fornecedor)+" · ":"")+(m.notaFiscal&&m.notaFiscal!=="-"?"NF "+esc(m.notaFiscal)+" · ":"")+(m.placa&&m.placa!=="-"?"Placa "+esc(m.placa)+" · ":"")+'Lançado por '+esc(m.quemLancou)+'</i></div><button type="button" data-del="'+m.linhaIndex+'" aria-label="Apagar lançamento">×</button></div>';
  }).join("") : '<div class="empty">Nenhum lançamento encontrado.</div>';
}

function mostrarAdm(){
  document.querySelectorAll(".adm").forEach(function(e){ e.hidden = !unlocked; });
  $("gest").textContent = unlocked ? "Bloquear área do gestor" : "Área do gestor";
}

$("gest").onclick = function(){
  if(unlocked){
    unlocked = false;
    codigoGestor = "";
    dadosGestor = null;
    mostrarAdm();
    return;
  }
  var senha = prompt("Digite o código do gestor:");
  if(!senha) return;

  fetch(API + "?acao=obterDadosGestor&codigo=" + encodeURIComponent(senha))
    .then(res => res.json())
    .then(data => {
      if(data.status === "sucesso"){
        unlocked = true;
        codigoGestor = senha;
        dadosGestor = data;
        mostrarAdm();
        atualizarTelaGestor();
      } else {
        alert(data.mensagem || "Código incorreto.");
      }
    })
    .catch(err => {
      alert("Erro ao validar código do gestor.");
    });
};

$("salvar").onclick = function(){
  var quem = $("quem").value.trim();
  var insumo = $("ins").value;
  var quantidade = parseFloat(String($("qtd").value).replace(",", "."));
  var data = $("dat").value;
  var placa = $("pla").value.trim().toUpperCase();
  var fornecedor = $("forn").value.trim();
  var notaFiscal = $("nf").value.trim();

  if(!quem){ msg("Digite o nome de quem está lançando.","err"); return; }
  if(!insumo){ msg("Escolha o insumo.","err"); return; }
  if(!(quantidade > 0)){ msg("Informe uma quantidade maior que zero.","err"); return; }
  if(!data){ msg("Informe a data.","err"); return; }
  if(tipo === "in"){
    if(!placa){ msg("Informe a placa do caminhão.","err"); return; }
    if(!fornecedor){ msg("Informe o fornecedor.","err"); return; }
    if(!notaFiscal){ msg("Informe a nota fiscal.","err"); return; }
  }

  var payload = {
    acao: "novoLancamento",
    tipo: tipo === "in" ? "Entrada" : "Retirada",
    quemLancou: quem,
    insumo: insumo,
    quantidade: quantidade,
    placa: placa,
    fornecedor: fornecedor,
    notaFiscal: notaFiscal
  };

  msg("Salvando lançamento...","ok");

  fetch(API, {
    method: "POST",
    body: JSON.stringify(payload)
  })
  .then(res => res.json())
  .then(data => {
    if(data.status === "sucesso"){
      msg(data.mensagem,"ok");
      $("qtd").value = "";
      $("pla").value = "";
      $("forn").value = "";
      $("nf").value = "";
      if(unlocked) {
        // Recarrega os dados do gestor se estiver logado
        $("gest").click();
        setTimeout($("gest").click, 500);
      }
    } else {
      msg(data.mensagem,"err");
    }
  })
  .catch(err => {
    msg("Erro ao comunicar com o servidor.","err");
  });
};

// Excluir lançamento (Gestor)
$("hist").onclick = function(e){
  var linha = e.target.getAttribute("data-del");
  if(!linha) return;
  if(!confirm("Deseja realmente apagar este lançamento?")) return;

  fetch(API, {
    method: "POST",
    body: JSON.stringify({
      acao: "apagarLancamento",
      codigo: codigoGestor,
      linhaIndex: Number(linha)
    })
  })
  .then(res => res.json())
  .then(data => {
    if(data.status === "sucesso"){
      alert("Lançamento excluído com sucesso!");
      $("gest").click();
      setTimeout($("gest").click, 500);
    } else {
      alert(data.mensagem);
    }
  });
};

// Cadastrar novo insumo
$("add").onclick = function(){
  var nomeInsumo = $("nn").value.trim();
  if(!nomeInsumo) return;

  fetch(API, {
    method: "POST",
    body: JSON.stringify({
      acao: "cadastrarInsumo",
      codigo: codigoGestor,
      nomeInsumo: nomeInsumo
    })
  })
  .then(res => res.json())
  .then(data => {
    if(data.status === "sucesso"){
      alert("Insumo cadastrado com sucesso!");
      $("nn").value = "";
      carregarInsumosPublicos();
      $("gest").click();
      setTimeout($("gest").click, 500);
    } else {
      alert(data.mensagem);
    }
  });
};

["fIns","fUser"].forEach(function(i){ $(i).onchange = atualizarTelaGestor; });

$("dat").value = hoje();
carregarInsumosPublicos();
})();
</script>
</body>
</html>
