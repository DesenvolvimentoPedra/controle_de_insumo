<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Controle de insumos</title>
<style>
:root{--bg:#f2f1ec;--card:#fff;--ink:#1f2a1f;--mut:#6b756b;--line:#dcdad0;--in:#2e7d4f;--out:#b8501f;--acc:#25402b;--on:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141a15;--card:#1d251e;--ink:#e8ece6;--mut:#9aa69a;--line:#2f3a30;--in:#5cbf86;--out:#e8885a;--acc:#5cbf86;--on:#0f1a12}}
:root[data-theme="dark"]{--bg:#141a15;--card:#1d251e;--ink:#e8ece6;--mut:#9aa69a;--line:#2f3a30;--in:#5cbf86;--out:#e8885a;--acc:#5cbf86;--on:#0f1a12}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:16px}
main{max-width:820px;margin:0 auto}
h1{font-size:22px;margin:4px 0 2px}
h2{font-size:16px;margin:0 0 10px}
.who{color:var(--mut);font-size:14px;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
.saldos{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.s{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px}
.s b{display:block;font-size:13px;color:var(--mut);font-weight:500}
.s span{font-size:24px;font-weight:700}
.s small{color:var(--mut);font-size:13px}
.s.neg span{color:var(--out)}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.tabs button{padding:12px;border:2px solid var(--line);background:transparent;color:var(--ink);border-radius:8px;font:600 16px inherit;font-family:inherit;cursor:pointer}
.tabs button.on.in{background:var(--in);border-color:var(--in);color:var(--on)}
.tabs button.on.out{background:var(--out);border-color:var(--out);color:var(--on)}
label{display:block;font-size:14px;color:var(--mut);margin:10px 0 4px}
input,select{width:100%;padding:11px;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.go{width:100%;margin-top:14px;padding:13px;border:0;border-radius:8px;background:var(--acc);color:var(--on);font:700 16px inherit;font-family:inherit;cursor:pointer}
.ghost{background:transparent;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:8px 12px;font:inherit;cursor:pointer}
.msg{margin-top:10px;font-size:14px;min-height:20px}
.msg.err{color:var(--out)}.msg.ok{color:var(--in)}
.h{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.h:first-of-type{border-top:0}
.h .q{font-weight:700;min-width:96px}
.h .q.in{color:var(--in)}.h .q.out{color:var(--out)}
.h .d{flex:1;font-size:14px}
.h .d i{display:block;color:var(--mut);font-style:normal}
.h button{background:none;border:0;color:var(--mut);font-size:20px;cursor:pointer;padding:4px 8px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px;margin-bottom:6px}
th,td{padding:7px 8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--mut);font-weight:500}
td.in{color:var(--in)}td.out{color:var(--out)}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:12px}
.filters label{margin:0 0 3px;font-size:13px}
.empty{color:var(--mut);padding:10px 0}
.hint{font-size:14px;font-weight:600;color:var(--in);margin-top:6px;min-height:20px}
.notice{background:var(--card);border:1px solid var(--out);border-radius:10px;padding:14px;margin-bottom:14px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
</style>
</head>
<body>
<main>
<h1>Controle de insumos</h1>
<div class="who" id="who">Conectando…</div>
<div class="notice" id="aviso" hidden>Entre na sua conta do Claude e abra o link compartilhado para registrar e ver os lançamentos.</div>
<div class="adm" hidden><h2>Estoque disponível para retirada</h2>
<div class="saldos" id="saldos"></div></div>

<section class="card">
 <div class="tabs">
  <button id="tIn" class="on in" type="button">Entrada (recebi)</button>
  <button id="tOut" class="out" type="button">Retirada (usei)</button>
 </div>
 <label for="quem">Quem está lançando</label>
 <input id="quem" type="text" maxlength="40" autocomplete="name" placeholder="Digite seu nome">
 <label for="ins">Insumo</label>
 <select id="ins"></select>
 <div class="hint" id="disp"></div>
 <div class="row">
  <div><label for="qtd">Quantidade (toneladas)</label><input id="qtd" type="number" inputmode="decimal" min="0" step="any" placeholder="0"></div>
  <div><label for="dat">Data</label><input id="dat" type="date"></div>
 </div>
 <div id="plW"><label for="pla">Placa do caminhão</label><input id="pla" type="text" maxlength="8" autocapitalize="characters" placeholder="ABC1D23"></div>
 <div id="nfW"><div class="row"><div><label for="forn">Fornecedor</label><input id="forn" type="text" maxlength="60"></div><div><label for="nf">Nota fiscal</label><input id="nf" type="text" maxlength="20" inputmode="numeric"></div></div></div>
 <div id="obsW"><label for="obs" id="obsL">Local ou finalidade de uso (opcional)</label>
 <input id="obs" type="text" maxlength="80"></div>
 <button class="go" id="salvar" type="button">Registrar entrada</button>
 <div class="msg" id="msg" role="status"></div>
</section>

<section class="card adm" hidden>
 <h2>Comparar entradas e retiradas</h2>
 <div class="filters">
  <div><label for="fIns">Insumo</label><select id="fIns"></select></div>
  <div><label for="fUser">Quem lançou</label><select id="fUser"></select></div>
  <div><label for="fDe">De</label><input id="fDe" type="date"></div>
  <div><label for="fAte">Até</label><input id="fAte" type="date"></div>
 </div>
 <div class="scroll"><table id="resumo"></table></div>
 <h2 style="margin-top:14px">Por mês</h2>
 <div class="scroll"><table id="mensal"></table></div>
</section>

<section class="card adm" hidden>
 <h2>Histórico</h2>
 <div style="margin-bottom:10px"><button class="ghost" id="csv" type="button">Copiar planilha</button> <span class="who" id="cont"></span></div>
 <div id="hist"></div>
</section>

<section class="card adm" hidden>
 <h2>Cadastrar novo insumo</h2>
 <div class="row">
  <div><label for="nn">Nome</label><input id="nn" type="text" maxlength="30" placeholder="Ex.: Ureia"></div>
  <div><label for="nu">Unidade</label><select id="nu"><option value="t">t (toneladas)</option><option>kg</option><option>sacos</option></select></div>
 </div>
 <button class="go" id="add" type="button">Adicionar insumo</button>
</section>
<div style="text-align:center;margin:8px 0 24px"><button class="ghost" id="gest" type="button" hidden>Área do gestor</button></div>
</main>

<script>
(function(){
var $=function(i){return document.getElementById(i)};
var nf=new Intl.NumberFormat("pt-BR",{maximumFractionDigits:3});
var db=null,user=null,myId=null,admin=false,unlocked=false,staff=[],prods=[],mov=[],names={},tipo="in";
function hoje(){var d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10)}
function br(d){return d.split("-").reverse().join("/")}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function nome(u){var p=names[u];return p&&p.name?(p.isMe?p.name+" (você)":p.name):(u||"Alguém")}
function unit(n){var p=prods.filter(function(x){return x.n===n})[0];return p?p.u:""}
function saldo(n){return mov.reduce(function(a,m){return m.p===n?a+(m.t==="in"?m.q:-m.q):a},0)}
function msg(t,c){var m=$("msg");m.textContent=t;m.className="msg "+c}
function fill(el,html){var v=el.value;el.innerHTML=html;if(v&&Array.prototype.some.call(el.options,function(o){return o.value===v}))el.value=v}
function filtered(){
 var i=$("fIns").value,u=$("fUser").value,a=$("fDe").value,b=$("fAte").value;
 return mov.filter(function(m){return(!i||m.p===i)&&(!u||(m.w||m.u)===u)&&(!a||m.d>=a)&&(!b||m.d<=b)}).sort(function(x,y){return x.d<y.d?1:x.d>y.d?-1:y.ts-x.ts});
}
function showAdm(){document.querySelectorAll(".adm").forEach(function(e){e.hidden=!(admin&&unlocked)});$("gest").textContent=unlocked?"Bloquear área do gestor":"Área do gestor";$("gest").hidden=!admin}
function renderStaff(){$("slist").innerHTML=staff.map(function(s){return'<div class="h"><div class="d">'+esc(s.n)+'</div><button type="button" data-sdel="'+esc(s.id)+'" aria-label="Remover">×</button></div>'}).join("")||'<div class="empty">Nenhum funcionário cadastrado.</div>'}
function dispHint(){var p=$("ins").value;$("disp").textContent=p&&admin&&unlocked?"Disponível para retirada: "+nf.format(saldo(p))+" "+unit(p):""}
function render(){
 $("saldos").innerHTML=prods.map(function(p){var s=saldo(p.n);return'<div class="s'+(s<0?" neg":"")+'"><b>'+esc(p.n)+'</b><span>'+nf.format(s)+"</span> <small>"+esc(p.u)+" disponíveis</small></div>"}).join("")||'<div class="empty">Nenhum insumo cadastrado ainda.</div>';
 var po=prods.map(function(p){return'<option value="'+esc(p.n)+'">'+esc(p.n)+" ("+esc(p.u)+")</option>"}).join("");
 fill($("ins"),po);dispHint();fill($("fIns"),'<option value="">Todos os insumos</option>'+po);
 var ids=[];mov.forEach(function(m){if(m.u&&ids.indexOf(m.u)<0)ids.push(m.w||m.u)});
 fill($("fUser"),'<option value="">Todas as pessoas</option>'+ids.map(function(u){return'<option value="'+esc(u)+'">'+esc(nome(u))+"</option>"}).join(""));
 var f=filtered(),r={},mm={};
 f.forEach(function(m){var o=r[m.p]||(r[m.p]={i:0,o:0});o[m.t==="in"?"i":"o"]+=m.q;var k=m.d.slice(0,7)+"|"+m.p,x=mm[k]||(mm[k]={i:0,o:0});x[m.t==="in"?"i":"o"]+=m.q});
 var ks=Object.keys(r);
 $("resumo").innerHTML=ks.length?"<tr><th>Insumo</th><th>Entrou</th><th>Saiu</th><th>Diferença</th></tr>"+ks.map(function(n){var o=r[n];return"<tr><td>"+esc(n)+'</td><td class="in">'+nf.format(o.i)+' '+esc(unit(n))+'</td><td class="out">'+nf.format(o.o)+' '+esc(unit(n))+"</td><td>"+nf.format(o.i-o.o)+"</td></tr>"}).join(""):'<tr><td class="empty">Sem lançamentos neste filtro.</td></tr>';
 var mk=Object.keys(mm).sort().reverse();
 $("mensal").innerHTML=mk.length?"<tr><th>Mês</th><th>Insumo</th><th>Entrou</th><th>Saiu</th></tr>"+mk.map(function(k){var p=k.split("|"),y=p[0].split("-"),o=mm[k];return"<tr><td>"+y[1]+"/"+y[0]+"</td><td>"+esc(p[1])+'</td><td class="in">'+nf.format(o.i)+'</td><td class="out">'+nf.format(o.o)+"</td></tr>"}).join(""):"";
 $("cont").textContent=f.length+" lançamento(s)";
 $("hist").innerHTML=f.length?f.map(function(m){return'<div class="h"><div class="q '+m.t+'">'+(m.t==="in"?"+ ":"− ")+nf.format(m.q)+" "+esc(unit(m.p))+'</div><div class="d"><b>'+esc(m.p)+"</b> · "+(m.t==="in"?"Entrada":"Retirada")+" em "+br(m.d)+"<i>"+(m.fo?esc(m.fo)+" · ":"")+(m.nf?"NF "+esc(m.nf)+" · ":"")+(m.pl?"Placa "+esc(m.pl)+" · ":"")+"Lançado por "+esc(m.w||nome(m.u))+(m.o?" · "+esc(m.o):"")+"</i></div>"+(admin?'<button type="button" data-del="'+esc(m.id)+'" aria-label="Apagar lançamento">×</button>':"")+"</div>"}).join(""):'<div class="empty">Nenhum lançamento neste filtro.</div>';
}
function setTipo(t){tipo=t;$("tIn").className=(t==="in"?"on ":"")+"in";$("tOut").className=(t==="out"?"on ":"")+"out";
 $("salvar").textContent=t==="in"?"Registrar entrada":"Registrar retirada";$("plW").hidden=t!=="in";
 $("nfW").hidden=t!=="in";$("obsW").hidden=t==="in"}
$("tIn").onclick=function(){setTipo("in")};
$("tOut").onclick=function(){setTipo("out")};
$("ins").onchange=dispHint;
["fIns","fUser","fDe","fAte"].forEach(function(i){$(i).onchange=render});
$("salvar").onclick=function(){
 if(!db){msg("Sem conexão com o armazenamento compartilhado.","err");return}
 var p=$("ins").value,q=parseFloat(String($("qtd").value).replace(",",".")),d=$("dat").value;
 if(!$("quem").value.trim()){msg("Digite o nome de quem está lançando.","err");return}
 if(!p){msg("Escolha o insumo.","err");return}
 if(!(q>0)){msg("Informe uma quantidade maior que zero.","err");return}
 if(!d){msg("Informe a data.","err");return}
 if(admin&&tipo==="out"&&q>saldo(p)+1e-9){msg("Retirada maior que o estoque disponível de "+p+". Chame o gestor.","err");return}
 var obs=$("obs").value.trim(),pl=tipo==="in"?$("pla").value.trim().toUpperCase():"";
 if(tipo==="in"&&!pl){msg("Informe a placa do caminhão que entregou a carga.","err");return}
 var fo=$("forn").value.trim(),nfv=$("nf").value.trim();
 if(tipo==="in"&&!fo){msg("Informe o fornecedor.","err");return}
 if(tipo==="in"&&!nfv){msg("Informe o número da nota fiscal.","err");return}
 db.doc("mov/"+myId).set({u:myId}).then(function(){return db.collection("mov/"+myId+"/e").add({t:tipo,p:p,q:q,d:d,o:obs,w:$("quem").value.trim(),pl:pl,fo:tipo==="in"?fo:"",nf:tipo==="in"?nfv:"",u:myId,ts:Date.now()})}).then(function(){
  $("qtd").value="";$("obs").value="";$("quem").value="";$("pla").value="";$("forn").value="";$("nf").value="";
  msg((tipo==="in"?"Entrada":"Retirada")+" registrada: "+nf.format(q)+" "+unit(p)+" de "+p+".","ok")
 },function(e){msg("Não foi possível salvar: "+(e&&e.message?e.message:"tente novamente")+". Peça permissão de edição ao responsável.","err")})};
$("hist").onclick=function(e){var id=e.target.getAttribute&&e.target.getAttribute("data-del");if(!id||!db)return;
 if(confirm("Apagar este lançamento?"))db.doc("mov/"+id).delete().catch(function(){msg("Não foi possível apagar.","err")})};
$("add").onclick=function(){
 var n=$("nn").value.trim();if(!n||!db)return;
 if(prods.some(function(p){return p.n.toLowerCase()===n.toLowerCase()})){msg("Esse insumo já existe.","err");return}
 db.collection("prods").add({n:n,u:$("nu").value}).then(function(){$("nn").value="";msg(n+" adicionado.","ok")},function(){msg("Não foi possível cadastrar o insumo.","err")})};
$("csv").onclick=function(){
 var rows=[["Data","Tipo","Insumo","Quantidade","Unidade","Lançado por","Placa","Fornecedor","Nota fiscal","Observação"]].concat(filtered().slice().reverse().map(function(m){return[br(m.d),m.t==="in"?"Entrada":"Retirada",m.p,String(m.q).replace(".",","),unit(m.p),(m.w||nome(m.u).replace(" (você)","")),m.pl||"",m.fo||"",m.nf||"",m.o]}));
 var t=rows.map(function(r){return r.join("\t")}).join("\n");
 try{navigator.clipboard.writeText(t).then(function(){msg("Planilha copiada. Cole no Excel ou Google Planilhas.","ok")},function(){msg("Não foi possível copiar neste navegador.","err")})}catch(e){msg("Não foi possível copiar neste navegador.","err")}};
async function sha(t){var b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t));return Array.prototype.map.call(new Uint8Array(b),function(x){return("0"+x.toString(16)).slice(-2)}).join("")}
var lockT=null;
function lock(){unlocked=false;showAdm();render()}
$("gest").onclick=async function(){
 if(unlocked){lock();return}
 try{
  var ref=db.doc("config/pin"),snap=await ref.get(),h=snap.exists?snap.data().h:null;
  var v=prompt(h?"Digite o PIN do gestor:":"Crie um PIN do gestor (mínimo 4 números):");
  if(!v)return;
  var hv=await sha(v);
  if(!h){if(!/^\d{4,}$/.test(v)){alert("Use pelo menos 4 números.");return}await ref.set({h:hv})}
  else if(hv!==h){alert("PIN incorreto.");return}
  unlocked=true;showAdm();render();clearTimeout(lockT);lockT=setTimeout(lock,600000);
 }catch(e){alert("Não foi possível abrir a área do gestor.")}};
$("quem").oninput=function(){if(this.value.trim().toLowerCase()==="controle"&&admin){this.value="";unlocked=true;showAdm();render();clearTimeout(lockT);lockT=setTimeout(lock,600000);window.scrollTo(0,0)}};
$("dat").value=hoje();
render();
async function init(){
 try{db=await claude.use("db");user=await claude.use("user")}catch(e){}
 if(!db||!user){$("who").textContent="Sem acesso ao armazenamento compartilhado.";$("aviso").hidden=false;return}
 try{var me=await user.me();myId=await user.id();admin=await user.canEdit();showAdm();$("who").textContent=(admin?"":"Seu acesso é só para registrar entradas e retiradas.")}catch(e){$("who").textContent=""}
 db.collection("prods").onSnapshot(function(s){prods=s.docs.map(function(d){var x=d.data();return{id:d.id,n:x.n,u:x.u}}).sort(function(a,b){return a.n.localeCompare(b.n,"pt-BR")});render()},function(){});
 db.collection("staff").onSnapshot(function(s){staff=s.docs.map(function(d){return{id:d.id,n:d.data().n||""}}).sort(function(a,b){return a.n.localeCompare(b.n,"pt-BR")});render()},function(){});
 var legacy=[],byU={},subs={};
 function mapM(id,x){return{id:id,t:x.t,p:x.p,q:Number(x.q)||0,d:x.d||"",o:x.o||"",pl:x.pl||"",fo:x.fo||"",nf:x.nf||"",w:x.w||"",u:x.u||"",ts:x.ts||0}}
 function flat(){var r=legacy.slice();Object.keys(byU).forEach(function(k){r=r.concat(byU[k])});return r}
 async function refresh(){mov=flat();var ids=[];mov.forEach(function(m){if(m.u&&ids.indexOf(m.u)<0)ids.push(m.u)});try{if(ids.length)names=await user.profiles(ids)}catch(e){}render()}
 if(admin)db.collection("mov").onSnapshot(async function(s){
  legacy=[];s.docs.forEach(function(d){var x=d.data();if(x.t&&x.q!==undefined){legacy.push(mapM(d.id,x))}else if(!subs[d.id]){subs[d.id]=db.collection("mov/"+d.id+"/e").onSnapshot(function(c){byU[d.id]=c.docs.map(function(e){return mapM(d.id+"/e/"+e.id,e.data())});refresh()},function(){})}});mov=flat();
  var ids=[];mov.forEach(function(m){if(m.u&&ids.indexOf(m.u)<0)ids.push(m.u)});
  try{if(ids.length)names=await user.profiles(ids)}catch(e){}
  render()},function(){});
}
init();
})();
</script>
</body>
</html>
